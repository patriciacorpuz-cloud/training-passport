<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Training Passport</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#1f2a24;--mu:#6b746e;--ac:#1f6b4a;--ln:#ded8cc;--ok:#dff3e6;--wa:#fff1c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191a;--card:#1f2425;--tx:#ecefe9;--mu:#9aa49d;--ac:#4cc08a;--ln:#363d3e;--ok:#1d3a2c;--wa:#3d3418}}
:root[data-theme="dark"]{--bg:#16191a;--card:#1f2425;--tx:#ecefe9;--mu:#9aa49d;--ac:#4cc08a;--ln:#363d3e;--ok:#1d3a2c;--wa:#3d3418}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:0}.sub{color:var(--mu);font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font:600 12px system-ui,sans-serif;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
input[type=text],input[type=date],textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
textarea{resize:vertical;min-height:54px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.meta{color:var(--mu);font:13px system-ui,sans-serif}
.badge{font:600 12px system-ui,sans-serif;padding:3px 9px;border-radius:99px;background:var(--ln)}
.done .badge{background:var(--ok);color:var(--ac)}.wait .badge{background:var(--wa)}
.done{border-left:5px solid var(--ac)}
.q{margin-top:10px}.q p{margin:0 0 4px}
.trainer{margin-top:12px;padding:10px;border:1px dashed var(--ln);border-radius:8px;font-family:system-ui,sans-serif}
.trainer label{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--tx);letter-spacing:0;margin:4px 0}
.trainer input{width:20px;height:20px;accent-color:var(--ac)}
button{font:600 14px system-ui,sans-serif;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.g{background:none;color:var(--ac)}
.ph{margin-top:12px;padding:10px;border:1px dashed var(--ln);border-radius:8px;font-family:system-ui,sans-serif}.pr{margin:8px 0}.pr img{display:block;max-width:100%;max-height:220px;border-radius:8px;margin:6px 0}.pr input[type=file]{font:13px system-ui,sans-serif;max-width:100%}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:16px;max-width:90vw;font:15px system-ui,sans-serif}dialog::backdrop{background:rgba(0,0,0,.5)}dialog p{margin:0 0 10px}dialog input{width:100%;padding:9px;margin-bottom:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}dialog .row{justify-content:flex-end}
@media print{:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--ln:#ccc;--ok:#dff3e6;--wa:#fff1c9}dialog{display:none}.noprint{display:none}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style></head><body><main>
<div class="sub">Digital Training Passport</div><h1>TRAINING PASSPORT</h1>
<div class="card"><div class="grid">
<div><label>Employee ID No.</label><input type="text" data-i="id"></div>
<div><label>Full Name</label><input type="text" data-i="name"></div>
<div><label>Position</label><input type="text" data-i="pos"></div>
<div><label>Store Assignment</label><input type="text" data-i="store"></div>
<div><label>Start Date</label><input type="date" data-i="start"></div>
</div><div class="row noprint" style="margin-top:10px"><span class="meta" id="im"></span><button id="ib" data-sv="info">Save details</button></div></div>
<div class="card"><div class="row"><b id="pt">0 of 14 trainings completed</b><span class="meta" id="pp"></span></div><div class="bar" style="margin-top:8px"><i id="pb"></i></div></div>
<div class="card noprint row"><span class="meta" id="tm">Trainee view — trainer checkboxes are locked.</span>
<span><button class="g" id="tb">Trainer mode</button> <button class="g" id="pr">Print / Save PDF</button> <button class="g" id="rs">Reset</button></span></div>
<div id="list"></div>
</main>
<script>
const SO=["Oct 17 – Oct 26"],SM=["Oct 28 – Nov 2"],SC=["Nov 4 – Nov 9"];
const Q=t=>[`What were the key points covered in ${t}?`,`What is one thing from ${t} you will apply in your daily work?`,`What questions or concerns do you still have about ${t}?`];
const T=[
["co","Company Orientation","Training / HR","RNO",["Oct 14"]],
["hr","HR Orientation","HR","RNO",["Oct 14"]],
["fs","Food Safety","Training","RNO",["Oct 15"]],
["io","In-Store Orientation","Area Manager","Assigned Store",["Oct 16"]],
["rp","Runner Program","Area Manager","Assigned Store",["Oct 16"]],
["st","Stewarding 101","Brand Chef","Assigned Store",["Oct 16"]],
["so","Station Opening","Area Manager","In-Store",SO],
["ss","Service Sequence","Area Manager","Assigned Store",["Oct 19"]],
["pk","Product Knowledge","Brand Chef","Assigned Store",["Oct 19"]],
["cp","CED Personality 101","Reiona Ido","RNO",["Oct 21"]],
["bc","Basic Culinary Training","Brand Chef","Assigned Store",["Oct 22"]],
["sm","Station Mid","Area Manager","In-Store",SM],
["sc","Station Closing","Area Manager","In-Store",SC],
["ev","Evaluation","Area Manager","—",["Nov 11"]]];
T.find(x=>x[0]=="cp")[2]="Reona Ido";
let S={i:{},a:{},t:{},l:{},p:{},q:{},s:{}},tr=false;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("passport")||"{}"))}catch(e){}
S.q=S.q||{};S.s=S.s||{};Object.keys(S.q).forEach(k=>{if(k!="info"&&!T.some(x=>x[0]==k))delete S.q[k]});
const save=()=>{try{localStorage.setItem("passport",JSON.stringify(S))}catch(e){}};
const done=x=>{const a=S.a[x[0]]||[],t=S.t[x[0]]||{};return S.l[x[0]]&&[0,1,2].every(k=>(a[k]||"").trim())&&x[4].every((_,k)=>t[k]&&(S.p[x[0]]||{})[k])};
const st=x=>done(x)?["done","Completed"]:((S.t[x[0]]||{})[0]!==undefined||Object.keys(S.t[x[0]]||{}).length)?["wait","In progress"]:["","Pending"];
// Send saved sections to HR's Google Sheet. Anything that can't be sent now
// (no signal) waits in S.q and is retried on load, when back online, and after every save.
const API="https://training-passport-api.vercel.app/api/submit";let busy=false;
function queue(k,photos){S.q[k]={ph:!!(photos||(S.q[k]||{}).ph)};save();flush()}
function payload(k){const b={info:S.i,infoSaved:S.l.info||"",done:T.filter(done).length,total:T.length};if(k=="info")return b;
 const n=T.findIndex(x=>x[0]==k),x=T[n],a=S.a[k]||[],t=S.t[k]||{},P=S.p[k]||{},L=S.l[k],m=x[4].length>1;
 b.training={n:n+1,name:x[1],dates:m?x[4][0]+" – "+x[4][x[4].length-1]:x[4][0],pic:x[2],venue:x[3],
  answers:L?[a[0]||"",a[1]||"",a[2]||""]:null,saved:L||"",photos:S.q[k].ph?x[4].map((_,j)=>(P[j]||{}).d||""):null,
  verified:x[4].map((d,j)=>t[j]?(m?"Day "+(j+1)+": ":"")+"ticked "+t[j]:"").filter(String).join("; ")};return b}
async function flush(){if(busy||!S.l.info)return;busy=true;
 try{for(const k of Object.keys(S.q)){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload(k))});
  const j=await r.json();if(!j.ok)throw 0;delete S.q[k];S.s[k]=today();save()}}catch(e){}
 busy=false;render()}
addEventListener("online",flush);
const sent=k=>S.q[k]?" · ⏳ Waiting to send to HR (needs internet)":S.s[k]?" · ✓ Sent to HR "+S.s[k]:"";
function render(){
 document.querySelectorAll("[data-i]").forEach(e=>{e.value=S.i[e.dataset.i]||"";e.readOnly=e.disabled=!!S.l.info});
 const li=S.l.info;document.getElementById("im").textContent=li?"🔒 Details saved "+li+sent("info"):"Fill in all fields, then save.";
 const ib=document.getElementById("ib");ib.dataset.sv=li?"":"info";ib.dataset.ul=li?"info":"";ib.textContent=li?"Unlock (trainer)":"Save details";ib.style.display=li&&!tr?"none":"";
 document.getElementById("list").innerHTML=T.map((x,n)=>{const[c,b]=st(x),a=S.a[x[0]]||[],t=S.t[x[0]]||{},P=S.p[x[0]]||{},m=x[4].length>1,L=S.l[x[0]];
 return `<div class="card ${c}" id="c-${x[0]}"><div class="row"><b>${n+1}. ${x[1]}</b><span class="badge">${b}</span></div>
 <div class="meta">${m?x[4][0]+" – "+x[4][x[4].length-1]+" ("+x[4].length+" days)":x[4][0]} · PIC: ${x[2]} · ${x[3]}</div>
 ${Q(x[1]).map((q,k)=>`<div class="q"><p>${q}</p><textarea data-a="${x[0]}" data-k="${k}" ${L?"readonly":""}>${a[k]||""}</textarea></div>`).join("")}
<div class="ph"><div class="meta">PROOF OF ATTENDANCE PHOTO</div>${x[4].map((d,k)=>{const p=P[k];return `<div class="pr"><span class="meta">${m?"Day "+(k+1)+" ("+d+")":"Photo of you at the training"}</span>${p?`<img src="${p.d}" alt="Attendance photo"><span class="meta">Uploaded ${p.t}</span>`:""}${L?"":`<div class="noprint"><input type="file" accept="image/*" data-p="${x[0]}" data-k="${k}">${p?` <button class="g" data-rp="${x[0]}" data-k="${k}">Remove</button>`:""}</div>`}</div>`}).join("")}</div>
<div class="row noprint" style="margin-top:10px"><span class="meta">${L?"🔒 Answers saved "+L+" — no further edits"+sent(x[0]):"Answer all 3, then save."}</span>${L?(tr?`<button class="g" data-ul="${x[0]}">Unlock (trainer)</button>`:""):`<button data-sv="${x[0]}">Save answers</button>`}</div>
  <div class="trainer"><div class="meta">TRAINER ATTENDANCE VERIFICATION</div>
 ${x[4].map((d,k)=>`<label><input type="checkbox" data-t="${x[0]}" data-k="${k}" ${t[k]?"checked":""} ${tr?"":"disabled"}>${m?"Attended (Day "+(k+1)+")":"Trainee attended this training"} ${t[k]?`<span class="meta">(ticked ${t[k]})</span>`:""}</label>`).join("")}</div></div>`}).join("");
 prog()}
function period(){const v=S.i.start,el=document.getElementById("pp");if(!v){el.textContent="Enter start date to see period";return}
 const[y,m,d]=v.split("-").map(Number),a=new Date(y,m-1,d),b=new Date(y,m-1,d+29),f=x=>x.toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
 el.textContent="Training period: "+f(a)+" – "+f(b)+" (30 days)"}
function prog(){period();const n=T.filter(done).length;document.getElementById("pt").textContent=n+" of "+T.length+" trainings completed";document.getElementById("pb").style.width=n/T.length*100+"%"}
document.addEventListener("input",e=>{const d=e.target.dataset;
 if(d.i){S.i[d.i]=e.target.value}
 else if(d.a){(S.a[d.a]=S.a[d.a]||[])[d.k]=e.target.value}
 else return;save();prog()});
const dlg=document.createElement("dialog");dlg.innerHTML='<form method="dialog"><p></p><input type="password" style="display:none"><div class="row"><button class="g" value="no">Cancel</button><button value="ok">OK</button></div></form>';document.body.appendChild(dlg);
function dlgShow(msg,inp,one){return new Promise(r=>{const p=dlg.querySelector("p"),i=dlg.querySelector("input");p.textContent=msg;i.style.display=inp?"":"none";i.value="";dlg.querySelector("button.g").style.display=one?"none":"";dlg.onclose=()=>r(dlg.returnValue=="ok"?(inp?i.value:true):(inp?null:false));dlg.returnValue="";dlg.showModal();if(inp)i.focus()})}
const say=m=>dlgShow(m,0,1),yes=m=>dlgShow(m,0,0),pin=()=>dlgShow("Enter trainer PIN",1,0);
async function doPrint(){let dl=null;try{dl=await claude.use("downloads")}catch(e){}
 if(!dl){try{print();return}catch(e){}return say("Printing is not available in this view. Open the page link in your browser and try again.")}
 const c=document.documentElement.cloneNode(true);
 c.querySelectorAll("script,.noprint,dialog").forEach(n=>n.remove());
 c.querySelectorAll("input[data-i]").forEach(n=>n.setAttribute("value",S.i[n.dataset.i]||""));
 const html="<!DOCTYPE html>"+c.outerHTML.replace("</body>","<script>addEventListener('load',()=>setTimeout(()=>print(),500))<\/script></body>");
 const nm=(S.i.name||"Trainee").trim().replace(/[^\w\-]+/g,"_");
 try{await dl.save({filename:"Training_Passport_"+nm+".html",data:html});say("Saved. Open the file on your device: the print window opens automatically. Choose Save as PDF as the printer.")}catch(e){if(!e||e.code!="declined")say("Could not save the file.")}}
document.getElementById("pr").onclick=doPrint;
function addPhoto(inp){const f=inp.files[0],id=inp.dataset.p,k=inp.dataset.k;if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const o=(S.p[id]=S.p[id]||{}),prev=o[k];o[k]={d:c.toDataURL("image/jpeg",.7),t:today()};try{localStorage.setItem("passport",JSON.stringify(S))}catch(e){prev?o[k]=prev:delete o[k];say("Storage is full. Remove another photo and try again.")}render()};im.onerror=()=>say("Could not read that image.");im.src=r.result};r.readAsDataURL(f)}
const today=()=>new Date().toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.sv){let ok,msg;
  if(d.sv=="info"){ok=["id","name","pos","store","start"].every(k=>(S.i[k]||"").trim());msg="Please fill in all five fields first."}
  else{if(!S.l.info)return say("Please fill in and save your details at the top first.");const a=S.a[d.sv]||[];ok=[0,1,2].every(k=>(a[k]||"").trim());msg="Please answer all 3 questions and upload the attendance photo(s) first.";const p=S.p[d.sv]||{};ok=ok&&T.find(x=>x[0]==d.sv)[4].every((_,k)=>p[k])}
  if(!ok)return say(msg);
  if(!await yes("Once saved, this cannot be edited. Save now?"))return;
  const k=d.sv;S.l[k]=today();save();render();queue(k,k!="info");if(k=="info")T.forEach(x=>{if(S.l[x[0]]&&!S.s[x[0]])queue(x[0],1)})}
 else if(d.rp){if(!await yes("Remove this photo?"))return;delete (S.p[d.rp]||{})[d.k];save();render()}
 else if(d.ul&&tr){if(!await yes("Unlock this section for editing?"))return;delete S.l[d.ul];save();render()}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.p){addPhoto(e.target);return}if(!d.t)return;
 const o=S.t[d.t]=S.t[d.t]||{};if(e.target.checked)o[d.k]=new Date().toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});else delete o[d.k];
 save();render();queue(d.t,0)});
document.getElementById("tb").onclick=async()=>{if(!tr){const p=await pin();if(p!=="7661")return say("Incorrect PIN")}tr=!tr;
 document.getElementById("tb").textContent=tr?"Exit trainer mode":"Trainer mode";
 document.getElementById("tm").textContent=tr?"Trainer mode ON — you can tick attendance.":"Trainee view — trainer checkboxes are locked.";render()};
document.getElementById("rs").onclick=async()=>{if(await yes("Clear ALL passport data?")){S={i:{},a:{},t:{},l:{},p:{},q:{},s:{}};save();render()}};
render();flush();
</script></body></html>
